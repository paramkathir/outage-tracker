services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: outages
      POSTGRES_USER: outages
      POSTGRES_PASSWORD: outages
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outages -d outages"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/outages
      DB_USER: outages
      DB_PASSWORD: outages
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
      DEMO_SEED: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
